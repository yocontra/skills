StylesPath = styles
MinAlertLevel = suggestion

Vocab = Skills

Packages = write-good

# Markdown: skill docs, command docs, references, READMEs
[*.md]
BasedOnStyles = Vale, write-good, Skills
# write-good's blunt rules, disabled with cause:
#   E-Prime  — forbids every "to be" (is/are); unworkable for instructions.
#   Passive  — flags ~1k correct infra sentences ("the token is rotated").
#   TooWordy — flags precise terms (validate, minimum, implement) as wordy.
#   Weasel   — flags meaning-bearing adverbs (usually, several) as filler.
# The Skills.* custom rules replace TooWordy/Weasel with curated, false-
# positive-free subsets. Terms enforces one casing per vocab entry, which
# our jargon legitimately varies.
write-good.E-Prime = NO
write-good.Passive = NO
write-good.TooWordy = NO
write-good.Weasel = NO
Vale.Terms = NO
# Backticked spans are code, not prose: identifiers, paths, and flags trip
# spelling and repetition (`.payload.payload`) with nothing to fix.
TokenIgnores = (\x60+[^\x60]*\x60+)

# Source comments and docstrings (Vale extracts comment/string text only,
# never the code itself).
[*.py]
BasedOnStyles = Vale, write-good, Skills
write-good.E-Prime = NO
write-good.Passive = NO
write-good.TooWordy = NO
write-good.Weasel = NO
Vale.Terms = NO
TokenIgnores = (\x60+[^\x60]*\x60+)

[*.{js,mjs}]
BasedOnStyles = Vale, write-good, Skills
write-good.E-Prime = NO
write-good.Passive = NO
write-good.TooWordy = NO
write-good.Weasel = NO
Vale.Terms = NO
TokenIgnores = (\x60+[^\x60]*\x60+)
